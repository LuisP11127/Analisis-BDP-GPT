# Publica la página en GitHub Pages. Antes de publicar ejecuta las pruebas y valida los datos.
name: Publicar página

on:
  push:
    branches:
      - main
      - claude/vigilant-feynman-97r0u8
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Validar datos
        run: npm run validar

      - name: Armar el sitio
        run: npm run sitio

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
